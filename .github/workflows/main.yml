name: Unity Build
on:
  workflow_dispatch:
  push:
    branches: [main]

# Personal 是单席位持有制:同一时刻只允许一场构建
concurrency:
  group: unity-personal-seat
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/powershell /usr/local/share/boost \
                      /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af
          df -h

      - uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          androidExportType: androidAppBundle        # apk / aab / androidStudioProject
          # androidKeystoreName / androidKeystoreBase64 / androidKeystorePass
          # androidKeyaliasName / androidKeyaliasPass  → 签名走 secrets

      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: build
