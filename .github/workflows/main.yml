name: Unity Build

on:
  workflow_dispatch:
  push:
    branches: [main]

# Personal 是单席位持有制:同一时刻只允许一场构建
concurrency:
  group: unity-personal-seat
  cancel-in-progress: false

jobs:
  # ───────────────────────── 测试 ─────────────────────────
  test:
    name: Test (EditMode + PlayMode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/powershell /usr/local/share/boost \
                      /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af
          df -h

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: UnityProj/Library
          key: Library-UnityProj-${{ hashFiles('UnityProj/ProjectSettings/ProjectVersion.txt') }}-${{ github.ref_name }}
          restore-keys: |
            Library-UnityProj-${{ hashFiles('UnityProj/ProjectSettings/ProjectVersion.txt') }}-

      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: UnityProj
          testMode: all              # editmode + playmode 在同一容器里跑完
          artifactsPath: artifacts
          coverageEnabled: false     # 需要覆盖率报告时改 true(部分 Unity 版本会因插桩崩溃)

      - uses: actions/upload-artifact@v4
        if: always()                 # 测试失败也保留结果,便于排查
        with:
          name: test-results
          path: artifacts
          retention-days: 14

  # ───────────────────────── 构建 ─────────────────────────
  build:
    name: Build Android AAB
    needs: test                      # 测试通过才打包;工程还没有测试时先注释掉这行
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/powershell /usr/local/share/boost \
                      /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af
          df -h

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: UnityProj/Library
          key: Library-UnityProj-${{ hashFiles('UnityProj/ProjectSettings/ProjectVersion.txt') }}-${{ github.ref_name }}
          restore-keys: |
            Library-UnityProj-${{ hashFiles('UnityProj/ProjectSettings/ProjectVersion.txt') }}-

      - uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: UnityProj
          targetPlatform: Android
          androidExportType: androidAppBundle   # apk → androidPackage / aab → androidAppBundle
          # 签名:到 Secrets 里配好后取消注释
          # androidKeystoreName: ${{ secrets.ANDROID_KEYSTORE_NAME }}
          # androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          # androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          # androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          # androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/Android/
          retention-days: 30
