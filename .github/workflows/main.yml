name: Unity Build

on:
  workflow_dispatch:
  push:
    branches: [main]

# test-runner 要把测试结果发成 Check Run,需要 checks: write
permissions:
  contents: read
  checks: write

# Personal 是单席位持有制:同一时刻只允许一场构建
concurrency:
  group: unity-personal-seat
  cancel-in-progress: false

jobs:
  # ───────────────────────── 测试 ─────────────────────────
  test:
    name: Test (EditMode + PlayMode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/powershell /usr/local/share/boost \
                      /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af
          df -h

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-UnityCITest-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-${{ github.ref_name }}
          restore-keys: |
            Library-UnityCITest-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-

      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: all              # editmode + playmode 在同一容器里跑完
          artifactsPath: artifacts
          # 不要设 coverageEnabled: false —— action 会转成 CLI 不认的 --no-coverageEnabled(v0.1.72 已知 bug),需要关覆盖时等 CLI 修复

      - uses: actions/upload-artifact@v4
        if: always()                 # 测试失败也保留结果,便于排查
        with:
          name: test-results
          path: artifacts
          retention-days: 14

  # ───────────────────────── 构建 ─────────────────────────
  build:
    name: Build Android AAB
    needs: test                      # 测试通过才打包;工程还没有测试时先注释掉这行
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/powershell /usr/local/share/boost \
                      /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af
          df -h

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-UnityCITest-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-${{ github.ref_name }}
          restore-keys: |
            Library-UnityCITest-${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}-

      # 拉 GHCR 私有镜像需要登录;镜像包设为 public 后可删掉这步
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 仓库里的 org.gradle.java.home 是本地 Windows 路径,改成镜像里 JDK 17 的路径
      - name: Point Gradle at JDK 17
        run: |
          grep -q '^org.gradle.java.home=' Assets/Plugins/Android/gradleTemplate.properties \
            && sed -i 's#^org\.gradle\.java\.home=.*#org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64#' Assets/Plugins/Android/gradleTemplate.properties \
            || echo 'org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64' >> Assets/Plugins/Android/gradleTemplate.properties

      - name: Lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          customImage: ghcr.io/${{ env.OWNER_LC }}/unity-android-ci:2022.3.62f3-agp8
          targetPlatform: Android
          androidExportType: androidAppBundle   # apk → androidPackage / aab → androidAppBundle
          # 签名:到 Secrets 里配好后取消注释
          # androidKeystoreName: ${{ secrets.ANDROID_KEYSTORE_NAME }}
          # androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          # androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          # androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          # androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/Android/
          retention-days: 30
